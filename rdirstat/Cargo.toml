[package]
name = "rdirstat"
version = "0.1.0"
edition = "2021"
description = "A fast disk space analyzer (TUI) — parallel scanner with live snapshot updates"
license = "MIT"
repository = "https://github.com/AndyGybels/rdirstat"
homepage = "https://github.com/AndyGybels/rdirstat"
readme = "../README.md"
categories = ["command-line-utilities", "filesystem", "visualization"]
keywords = ["disk-usage", "ncdu", "du", "tui", "filesystem"]

[dependencies]
# Path is for local development, version is what crates.io uses when published.
rdirstat-core = { path = "../rdirstat-core", version = "0.1.0" }
crossterm = "0.28"
ratatui = "0.29"

[package.metadata.deb]
section = "utils"
assets = [
    ["target/release/rdirstat", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
summary = "A fast disk space analyzer (TUI)"
assets = [
    { source = "target/release/rdirstat", dest = "/usr/bin/rdirstat", mode = "755" },
]
auto-req = "auto"
