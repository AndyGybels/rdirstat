[package]
name = "rdirstat-gui"
version = "0.1.0"
edition = "2021"
description = "A fast disk space analyzer (GUI) — parallel scanner with live snapshot updates, built on egui"
license = "MIT"
repository = "https://github.com/AndyGybels/rdirstat"
homepage = "https://github.com/AndyGybels/rdirstat"
readme = "../README.md"
categories = ["filesystem", "visualization", "gui"]
keywords = ["disk-usage", "ncdu", "du", "egui", "filesystem"]

[dependencies]
rdirstat-core = { path = "../rdirstat-core", version = "0.1.0" }
eframe = "0.31"
egui_extras = "0.31"

[package.metadata.deb]
section = "utils"
assets = [
    ["target/release/rdirstat-gui", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
summary = "A fast disk space analyzer (GUI)"
# `auto-req = "auto"` extracts NEEDED entries from the ELF binary so the RPM's
# Requires: list reflects actual library dependencies (libGL, libxcb,
# libwayland, libxkbcommon, libfontconfig, …) without us hand-curating.
assets = [
    { source = "target/release/rdirstat-gui", dest = "/usr/bin/rdirstat-gui", mode = "755" },
]
auto-req = "auto"
