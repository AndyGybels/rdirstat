name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libatk1.0-dev

      - name: Run tests
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo test -p rdirstat-core

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p rdirstat -p rdirstat-gui

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rdirstat dist/rdirstat-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/rdirstat-gui dist/rdirstat-gui-${{ matrix.target }}
          cd dist
          tar czf rdirstat-${{ matrix.target }}.tar.gz rdirstat-${{ matrix.target }} rdirstat-gui-${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rdirstat.exe dist/rdirstat-${{ matrix.target }}.exe
          cp target/${{ matrix.target }}/release/rdirstat-gui.exe dist/rdirstat-gui-${{ matrix.target }}.exe
          cd dist
          7z a rdirstat-${{ matrix.target }}.zip rdirstat-${{ matrix.target }}.exe rdirstat-gui-${{ matrix.target }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/rdirstat-${{ matrix.target }}.*

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libatk1.0-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build release
        run: cargo build --release -p rdirstat -p rdirstat-gui

      - name: Build .deb (TUI)
        run: cargo deb -p rdirstat --no-build

      - name: Build .deb (GUI)
        run: cargo deb -p rdirstat-gui --no-build

      - name: Collect debs
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb

  release:
    needs: [build, deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.deb
