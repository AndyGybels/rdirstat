name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libatk1.0-dev

      - name: Run tests
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo test -p rdirstat-core

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p rdirstat -p rdirstat-gui

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rdirstat dist/rdirstat-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/rdirstat-gui dist/rdirstat-gui-${{ matrix.target }}
          cd dist
          tar czf rdirstat-${{ matrix.target }}.tar.gz rdirstat-${{ matrix.target }} rdirstat-gui-${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rdirstat.exe dist/rdirstat.exe
          cp target/${{ matrix.target }}/release/rdirstat-gui.exe dist/rdirstat-gui.exe

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set TAG=${{ github.ref_name }}
          set VERSION=%TAG:v=%
          iscc /DMyAppVersion=%VERSION% installer\windows.iss
          move /Y installer\Output\rdirstat-setup-x86_64.exe dist\rdirstat-setup-x86_64.exe

      - name: Upload artifacts (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/rdirstat-${{ matrix.target }}.*

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/rdirstat-setup-x86_64.exe

  deb:
    name: deb (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libatk1.0-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build release
        run: cargo build --release -p rdirstat -p rdirstat-gui

      - name: Build .deb (TUI)
        run: cargo deb -p rdirstat --no-build

      - name: Build .deb (GUI)
        run: cargo deb -p rdirstat-gui --no-build

      - name: Collect debs
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: dist/*.deb

  rpm:
    name: rpm (${{ matrix.arch }})
    # Mirrors the `deb` job: both architectures are built on native runners
    # (no QEMU / cross-compile). cargo-generate-rpm reads the
    # `[package.metadata.generate-rpm]` section we added to each Cargo.toml
    # and emits an RPM whose Requires: list is auto-derived from the binary's
    # ELF NEEDED entries via `auto-req = "auto"`.
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libatk1.0-dev rpm

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build release
        run: cargo build --release -p rdirstat -p rdirstat-gui

      # `[profile.release] strip = true` already removes symbols, but be
      # defensive — RPM doesn't want them either way.
      - name: Strip binaries
        run: strip target/release/rdirstat target/release/rdirstat-gui

      - name: Build .rpm (TUI)
        run: cargo generate-rpm --package rdirstat --payload-compress zstd

      - name: Build .rpm (GUI)
        run: cargo generate-rpm --package rdirstat-gui --payload-compress zstd

      - name: Collect rpms
        run: |
          mkdir -p dist
          cp target/generate-rpm/*.rpm dist/

      - name: Upload rpm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.arch }}
          path: dist/*.rpm

  release:
    needs: [build, deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
